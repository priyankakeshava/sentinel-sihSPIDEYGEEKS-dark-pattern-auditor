services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  darkshop:
    build:
      context: ./darkshop
    ports:
      - "9000:9000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      DARKSHOP_URL: http://darkshop:9000
    depends_on:
      postgres:
        condition: service_healthy
      darkshop:
        condition: service_started
    ports:
      - "8999:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  sentinel_postgres: